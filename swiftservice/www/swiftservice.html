<!doctype html>
<html class="h-full" lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
		/>
		<title>SwiftService</title>
		<link rel="icon" href="/assets/swiftservice/favicon.ico?v={{ asset_version }}" sizes="any" />
		<link rel="icon" type="image/png" href="/assets/swiftservice/favicon.png?v={{ asset_version }}" sizes="32x32" />
		<link rel="icon" type="image/png" href="/assets/swiftservice/logo-white.png?v={{ asset_version }}" sizes="192x192" />
		<link rel="apple-touch-icon" href="/assets/swiftservice/apple-touch-icon.png?v={{ asset_version }}" />
		<link rel="stylesheet" href="/assets/swiftservice/frontend/assets/swiftservice.css?v={{ asset_version }}" />
		<script>
			window.__SS_ASSET_VERSION__ = {{ asset_version | tojson }};
		</script>
	</head>
	<body class="h-full overscroll-none">
		<div id="app" class="h-full"></div>
		<script>
			{% for key in boot %}
			window["{{ key }}"] = {{ boot[key] | tojson }};
			{% endfor %}
			window.boot = {{ boot | tojson }};
		</script>
		<script type="module" crossorigin src="/assets/swiftservice/frontend/assets/swiftservice.js?v={{ asset_version }}"></script>
	</body>
</html>
